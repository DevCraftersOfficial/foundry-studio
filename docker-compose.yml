services:
  postgres:
    image: postgres:18-alpine
    container_name: foundry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundry_studio}
      POSTGRES_USER: ${POSTGRES_USER:-foundry_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foundry123}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - foundry_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foundry_postgres_data:
    name: foundry_postgres_data

